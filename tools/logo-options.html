<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анимация логотипа</title>
<style>
  :root { --accent: #4f46e5; --text: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text); font: 16px/24px system-ui, -apple-system, sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 600; }
  main > p { margin: 0 0 32px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { padding: 24px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .2s; }
  .card:hover { border-color: var(--accent); }
  .stage { display: flex; align-items: center; gap: 32px; height: 104px; margin-bottom: 20px; }
  svg { display: block; overflow: visible; flex: none; }
  svg path { fill: var(--accent); stroke: var(--accent); stroke-width: 0; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .p-i, .p-g, .p-d { transform-box: fill-box; transform-origin: center; }
  .p-d { transform-origin: 50% 100%; }
  .shine { fill: #c7d2fe; }
  h2 { margin: 0 0 4px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 20px; }
  .tag { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>Анимация логотипа по ховеру</h1>
  <p>Наведи курсор на карточку. Слева логотип в размере шапки, справа он же крупно.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const I = "M5.77356 26.9043H0V0.412726H5.77356V26.9043Z";
  const G = "M21.4157 0C23.6466 8.65056e-06 25.6691 0.412794 27.4832 1.23818C29.3218 2.06363 30.842 3.20208 32.0433 4.65281L28.1089 8.66821C27.2753 7.56759 26.2945 6.7422 25.1668 6.19186C24.039 5.64152 22.764 5.3664 21.342 5.3664C19.8221 5.36642 18.4615 5.71617 17.2602 6.41654C16.059 7.0919 15.1151 8.05502 14.4287 9.30563C13.7668 10.5313 13.4354 11.97 13.4354 13.6209C13.4354 15.272 13.7667 16.7231 14.4287 17.9738C15.0906 19.2245 15.9974 20.2001 17.1496 20.9005C18.3019 21.601 19.6263 21.9516 21.1218 21.9516C22.6415 21.9516 23.9284 21.6637 24.9825 21.0886C26.0611 20.4883 26.8825 19.6375 27.4464 18.537C27.6915 18.068 27.8846 17.5571 28.0276 17.0057L20.5699 16.8861V11.8948H34.2132V12.7579C34.2132 15.9348 33.6492 18.6114 32.5215 20.7877C31.4182 22.939 29.8736 24.5655 27.8877 25.6662C25.9265 26.7667 23.659 27.317 21.085 27.3171C19.1972 27.3171 17.419 26.9674 15.7518 26.2669C14.1093 25.5665 12.6756 24.6026 11.4498 23.3769C10.2241 22.1262 9.25552 20.6757 8.54456 19.0249C7.85809 17.3489 7.51441 15.5471 7.51441 13.6209C7.51443 11.6948 7.87047 9.90645 8.58142 8.25549C9.29241 6.60446 10.2731 5.16595 11.5235 3.94019C12.7983 2.68949 14.2814 1.72649 15.973 1.0511C17.6646 0.350666 19.4789 0 21.4157 0Z";
  const D = "M36.6534 19.9921C37.6341 19.9922 38.4306 20.3302 39.0436 21.0056C39.681 21.656 40 22.4814 40 23.482C40 24.4325 39.681 25.2454 39.0436 25.9207C38.4307 26.5961 37.6341 26.9342 36.6534 26.9342C35.6973 26.9342 34.9007 26.5961 34.2633 25.9207C33.6259 25.2454 33.3069 24.4325 33.3069 23.482C33.3069 22.4814 33.6259 21.656 34.2633 21.0056C34.9007 20.3302 35.6973 19.9921 36.6534 19.9921Z";
  const SPRING = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  const anim = (el, frames, duration, easing = "ease-in-out") => el && el.animate(frames, { duration, easing });

  const options = [
    {
      name: "Точка подпрыгивает", tag: "рекомендую", note: "Двигается только точка, 0,5 с. Буквы на месте, логотип читается всё время.",
      run: (s) => [anim(s.querySelector(".p-d"), [
        { transform: "translateY(0) scale(1, 1)", easing: "ease-out" },
        { transform: "translateY(-12px) scale(0.95, 1.05)", offset: 0.45, easing: "ease-in" },
        { transform: "translateY(0) scale(1.15, 0.8)", offset: 0.75 },
        { transform: "translateY(0) scale(1, 1)" },
      ], 520, "linear")],
    },
    {
      name: "Разъезд", note: "I и точка расходятся от G и пружинят обратно, 0,6 с. Логотип будто вдыхает.",
      run: (s) => [[".p-i", -3], [".p-d", 3]].map(([sel, x]) => anim(s.querySelector(sel), [
        { transform: "translateX(0)", easing: "ease-out" },
        { transform: `translateX(${x}px)`, offset: 0.35, easing: SPRING },
        { transform: "translateX(0)" },
      ], 600, "linear")),
    },
    {
      name: "Блик", note: "По знаку проходит светлая полоса, 0,7 с. Форма не меняется. Самый спокойный вариант.",
      run: (s) => [anim(s.querySelector(".shine"), [{ transform: "translateX(0)" }, { transform: "translateX(72px)" }], 700)],
    },
    {
      name: "Перерисовка", note: "Заливка гаснет, контур рисуется заново, заливка возвращается, 1,1 с. Заметнее всех, но и дольше.",
      run: (s) => [...s.querySelectorAll("path")].map((p) => anim(p, [
        { fillOpacity: 1, strokeDashoffset: 1, strokeWidth: 0.7 },
        { fillOpacity: 0, strokeDashoffset: 1, strokeWidth: 0.7, offset: 0.15 },
        { fillOpacity: 0, strokeDashoffset: 0, strokeWidth: 0.7, offset: 0.7 },
        { fillOpacity: 1, strokeDashoffset: 0, strokeWidth: 0.7, offset: 0.85 },
        { fillOpacity: 1, strokeDashoffset: 0, strokeWidth: 0 },
      ], 1100)),
    },
    {
      name: "Колесо", note: "G делает оборот в плоскости, без зеркала, 0,8 с. Круглая буква катится, I и точка стоят.",
      run: (s) => [anim(s.querySelector(".p-g"), [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], 800, "cubic-bezier(0.65, 0, 0.35, 1)")],
    },
  ];

  let uid = 0;
  const logo = (width, withShine) => {
    const id = `clip${uid++}`;
    const paths = `<path class="p-i" pathLength="1" d="${I}"/><path class="p-g" pathLength="1" d="${G}"/><path class="p-d" pathLength="1" d="${D}"/>`;
    const shine = withShine
      ? `<clipPath id="${id}"><path d="${I}"/><path d="${G}"/><path d="${D}"/></clipPath><g clip-path="url(#${id})"><polygon class="shine" points="-14,0 -4,0 -14,27.32 -24,27.32"/></g>`
      : "";
    return `<svg viewBox="0 0 40 27.3171" width="${width}" height="${(width * 27.3171) / 40}" role="img" aria-label="Логотип">${paths}${shine}</svg>`;
  };

  const grid = document.getElementById("grid");
  options.forEach((o) => {
    const card = document.createElement("div");
    card.className = "card";
    const hasShine = o.name === "Блик";
    card.innerHTML = `<div class="stage">${logo(40, hasShine)}${logo(120, hasShine)}</div><h2>${o.name}${o.tag ? ` · <span class="tag">${o.tag}</span>` : ""}</h2><p>${o.note}</p>`;
    let running = [];
    const play = () => {
      if (running.some((a) => a && a.playState === "running")) return;
      running = [...card.querySelectorAll("svg")].flatMap((s) => o.run(s));
    };
    card.addEventListener("pointerenter", play);
    card.addEventListener("click", play);
    grid.append(card);
  });
</script>
</body>
</html>
